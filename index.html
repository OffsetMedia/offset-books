<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offset Books</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Offset Books">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="screen-signin" class="screen center" hidden>
  <div class="signin-card">
    <div class="wordmark">OFFSET <span class="media">MEDIA</span></div>
    <h1>Offset Books</h1>
    <p class="muted">Sign in with your Offset Media Google account.</p>
    <div id="g-button" class="g-button"></div>
    <p id="signin-msg" class="msg" role="alert"></p>
  </div>
</section>

<section id="screen-setup" class="screen center" hidden>
  <div class="signin-card">
    <div class="wordmark">OFFSET <span class="media">MEDIA</span></div>
    <h1>Setup needed</h1>
    <p class="muted">Open <code>config.js</code> and fill in <code>clientId</code> and <code>apiUrl</code>, then reload.</p>
  </div>
</section>

<section id="screen-loading" class="screen center">
  <div class="spinner" aria-label="Loading"></div>
</section>

<div id="app" class="app" hidden>
  <nav class="nav" aria-label="Main">
    <div class="nav-brand wordmark">OFFSET <span class="media">MEDIA</span></div>
    <button class="nav-item" data-view="dashboard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>
    <button class="nav-item" data-view="projects"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg><span>Projects</span></button>
    <button class="nav-item nav-secondary" data-view="clients"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg><span>Clients</span></button>
    <button class="nav-item" data-view="sales"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14.5 3v4.5H19M9 12h7M9 16h5"/></svg><span>Invoices</span></button>
    <button class="nav-item" data-view="review" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H4z"/><path d="M4 13h4l1.5 2.5h5L16 13h4"/><path d="M8 20h8"/></svg><span>Review</span><span class="navbadge" id="assign-count" hidden></span></button>
    <button class="nav-item nav-secondary" data-view="entries"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Entries</span></button>
    <button class="nav-item" data-view="more"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
  </nav>
  <main class="main">
    <header class="topbar">
      <div class="who" id="who"></div>
      <span class="saving" id="saving" hidden>Saving&hellip;</span>
      <button class="pill ghost" id="btn-refresh" type="button">Refresh</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.OB && window.OB.gsiReady()"></script>
</body>
</html>
