<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Offset Books</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Offset Books">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Inter:opsz,wght@14..32,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="theme.js?v=2026-11-05.6"></script>
<link rel="stylesheet" href="legacy.css?v=2026-11-05.6">
<link rel="stylesheet" href="extras.css?v=2026-11-05.6">
</head>
<body>
<section id="ob-signin" class="ob-screen" hidden>
  <div class="ob-card">
    <div class="logo"><span class="w">OFFSET</span><span class="m">MEDIA</span></div>
    <h1>Offset Books</h1>
    <p class="note">Sign in with your Offset Media Google account.</p>
    <div id="ob-gbtn" class="ob-gbtn"></div>
    <p id="ob-msg" class="ob-msg" role="alert"></p>
    <button id="ob-retry" class="btn" hidden type="button">Try again</button>
  </div>
</section>
<section id="ob-loading" class="ob-screen">
  <div class="ob-card ob-loadcard">
    <div class="logo"><span class="w">OFFSET</span><span class="m">MEDIA</span></div>
    <div class="ob-spin" aria-hidden="true"></div>
    <p id="ob-loadmsg" class="note">Opening your books…</p>
  </div>
</section>

<div id="shell" hidden>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script src="config.js?v=2026-11-05.6"></script>
<script src="boot.js?v=2026-11-05.6"></script>
</body>
</html>
